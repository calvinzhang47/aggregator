name: 订阅聚合

on:
  # 每 6 小时运行一次（UTC 时间，对应北京时间 02:00 / 08:00 / 14:00 / 20:00）
  schedule:
    - cron: "0 */6 * * *"
  # 手动触发
  workflow_dispatch:
  # 改了配置或工作流本身时也跑一次
  push:
    branches: [main]
    paths:
      - "ci/**"
      - ".github/workflows/aggregate.yml"
      - ".github/scripts/**"

# 同一时间只允许一个实例，避免两次运行同时写 Gist
concurrency:
  group: aggregate-subscriptions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aggregate:
    name: 抓取 / 验活 / 发布
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复上一次成功的结果
        uses: actions/cache/restore@v4
        with:
          path: .previous
          key: last-good-${{ github.run_id }}
          restore-keys: |
            last-good-

      - name: 抓取订阅 + 实测验活 + 生成三种格式
        run: |
          python subscribe/process.py -s ci/config.json -i

      - name: 去重 + 校验 + 重建格式
        env:
          MIN_NODES: "5"
        run: python .github/scripts/postprocess.py

      - name: 发布到 GitHub Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python .github/scripts/publish.py

      - name: 备份本次结果供下次兜底
        if: success()
        run: |
          mkdir -p .previous/output
          cp -f output/proxy-clash.yaml output/proxy-singbox.json output/proxy-v2ray.txt .previous/output/ || true

      - name: 写入缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .previous
          key: last-good-${{ github.run_id }}

      - name: 失败说明
        if: failure()
        run: |
          {
            echo "### 本次运行未产出有效节点"
            echo ""
            echo "已跳过 Gist 更新，订阅地址内容保持上一次的结果，继续可用。"
          } >> "$GITHUB_STEP_SUMMARY"
